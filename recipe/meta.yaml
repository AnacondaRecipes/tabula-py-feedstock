{% set name = "tabula-py" %}
{% set version = "2.10.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/t/tabula-py/tabula_py-2.10.0.tar.gz
  sha256: 75968a83fe978e5d56ccf23f0f0255a459c256b7b52db7cabe5ac795bb3b12df

build:
  number: 0
  skip: true  # [py<37]
  # openjdk >=8 isn't available on ppc64le, s390x
  skip: true  # [ppc64le or s390x]
  script:
    - python -m pip install --no-deps --ignore-installed .

requirements:
  host:
    - python
    - pip
    - setuptools >=45
    - setuptools_scm
    - setuptools-scm >=6.2
  run:
    - python
    - pandas >=0.25.3
    - numpy >1.24.4
    - distro
    - openjdk >=8

test:
  requires:
    - pip
  commands:
    - python -c "import tabula; tabula.environment_info()"
    - pip check

about:
  home: https://github.com/chezou/tabula-py
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: "Simple wrapper of tabula-java: extract table from PDF into pandas DataFrame"
  description: |
    tabula-py is a simple Python wrapper of tabula-java, which can read
    table of PDF. You can read tables from PDF and convert into pandas's
    DataFrame. tabula-py also enables you to convert a PDF file into
    CSV/TSV/JSON file.
  doc_url: https://tabula.technology/
  dev_url: https://github.com/chezou/tabula-py

extra:
  recipe-maintainers:
    - CurtLH
    - sodre
    - tpmusielak
